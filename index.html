<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brick Garden">
<title>Brick Garden</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Baloo 2",system-ui,sans-serif;font-weight:800;color:#34405a;
  background:linear-gradient(#9fdcff 0%,#d8f3ff 55%,#c9f2c0 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}

/* —— home —— */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;padding:16px;
  background:linear-gradient(#9fdcff 0%,#d8f3ff 55%,#c9f2c0 100%)}
#home h1{margin:0;font-size:clamp(40px,8vw,84px);letter-spacing:.02em;text-shadow:0 4px 0 #fff}
#home h1 span:nth-child(5n+1){color:#e53935}#home h1 span:nth-child(5n+2){color:#ff8a1f}
#home h1 span:nth-child(5n+3){color:#f2b600}#home h1 span:nth-child(5n+4){color:#3fae49}#home h1 span:nth-child(5n){color:#2f8fe0}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2vw,22px);max-width:1200px}
#worlds{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tab{padding:8px 26px 10px;border-radius:999px;background:#fff;color:var(--c);font-size:clamp(22px,3vw,32px);box-shadow:0 6px 0 #b9d3e6}
.tab.on{background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.tab.locked{background:#eaf2f8;color:#b6c4d0}
.tab.shake{animation:shake .4s}
.card{position:relative;width:clamp(110px,14vw,170px);padding:8px 8px 12px;border-radius:26px;background:#fff;
  box-shadow:0 8px 0 #b9d3e6,0 14px 24px rgba(40,80,120,.18);display:flex;flex-direction:column;align-items:center}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 #b9d3e6}
.card img{width:100%;aspect-ratio:1;pointer-events:none}
.card .w{font-size:clamp(18px,2.5vw,28px);line-height:1.1}
.card .st{position:absolute;top:2px;right:10px;font-size:40px;color:#ffc400;text-shadow:0 2px 0 #c98a00}
.card.locked{background:#eaf2f8}
.card.locked img{filter:brightness(0);opacity:.16}
.card.locked .w{opacity:0}
.card.next{animation:bob 1.1s ease-in-out infinite}
.card.shake,.opt.shake{animation:shake .4s}
#boot{font-size:18px;font-weight:600;max-width:90vw;text-align:center;color:#5a6b85}
#gear{position:fixed;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.5);font-size:24px;color:#8aa}

/* —— build —— */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto;transition:opacity .18s}
body.placing #hud>*:not(#ref){opacity:0;pointer-events:none}
.round{position:absolute;top:max(12px,env(safe-area-inset-top));width:72px;height:72px;border-radius:50%;background:#fff;
  box-shadow:0 6px 0 #b9d3e6;display:grid;place-items:center}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 #b9d3e6}
.round svg{width:40px;height:40px}
#back{left:12px}#spin{right:12px}
.tool{top:calc(max(12px,env(safe-area-inset-top)) + 88px)}
#undo{left:12px}#zoom{right:12px}
#hand{right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 176px)}
#grab{left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 264px)}
body.grabbing #hud>#trash{opacity:1;transform:scale(1.2)}
body.grabbing #hud>#trash.hot{background:#ffd9d9;box-shadow:0 0 0 6px #e53935;transform:scale(1.45)}
#hand.on,#trash.on,#grab.on{background:#fff3b8;box-shadow:0 0 0 5px #ffc400}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + clamp(76px,10vw,100px) + 32px);
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(120,160,190,.4);max-width:calc(100vw - 24px)}
body:not(.free) #bar{display:none}
#swatches{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #c5d5e2,0 4px 0 #b9d3e6;flex:none}
.sw.on{box-shadow:0 0 0 6px #ffc400;transform:scale(1.08)}
#bar .round{position:static;width:58px;height:58px;flex:none;box-shadow:0 4px 0 #b9d3e6}
#bar .round svg{width:34px;height:34px}
.deco.on{background:#fff3b8;box-shadow:0 0 0 5px #ffc400}
.pop{z-index:5;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);border-radius:28px;padding:16px;box-shadow:0 8px 0 rgba(120,160,190,.45),0 16px 40px rgba(40,80,120,.25)}
#texmenu{display:flex;gap:14px}
#texmenu .round{position:static;width:76px;height:76px;flex:none;font-size:24px}
#texmenu .round svg{width:46px;height:46px}
#texmenu .round.on{background:#fff3b8;box-shadow:0 0 0 5px #ffc400}
#keys{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto}
#keys button{width:clamp(40px,7.4vw,62px);aspect-ratio:1;border-radius:14px;background:#eef5fb;box-shadow:0 4px 0 #b9d3e6;font-size:clamp(22px,4vw,34px)}
#keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #b9d3e6}
#ref{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 88px);width:clamp(130px,19vw,210px);aspect-ratio:1;
  background:#fff;border-radius:24px;box-shadow:0 6px 0 #b9d3e6;pointer-events:none}
.opt{position:relative}
#tray:empty{display:none}
.opt .n{position:absolute;right:-6px;top:-8px;min-width:34px;height:34px;border-radius:17px;background:#2f8fe0;color:#fff;font-size:22px;line-height:34px;text-align:center}
#trash{left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 176px)}
body:not(.free) .tool{display:none}
body.free #dots{display:none}
body.free #tray{max-width:calc(100vw - 24px);overflow-x:auto;overflow-y:hidden;touch-action:pan-x;gap:10px;padding:10px 12px;scrollbar-width:none}
body.free .opt{flex:none;width:clamp(76px,10vw,100px)}
body.free .opt.sel{animation:none;outline-width:6px}
.card.free{background:#fff8d6}
#title{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;
  background:rgba(255,255,255,.92);border-radius:28px;padding:8px 26px 10px;box-shadow:0 6px 0 rgba(120,160,190,.45);white-space:nowrap;pointer-events:none}
#say{font-size:clamp(26px,4.4vw,44px);line-height:1.15}
#hint{font-size:clamp(20px,3vw,30px);line-height:1.2;min-height:1.2em}
#hint b{-webkit-text-stroke:1.5px #34405a;paint-order:stroke fill}
#dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
#dots i{width:14px;height:14px;border-radius:50%;background:#d5e2ec}
#dots i.on{background:#3fae49}
#tray{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:18px;
  padding:12px 16px;border-radius:34px;background:rgba(255,255,255,.75);box-shadow:0 6px 0 rgba(120,160,190,.4)}
.opt{width:clamp(96px,15vw,130px);aspect-ratio:1;border-radius:26px;background:#fff;box-shadow:0 6px 0 #b9d3e6;padding:4px;display:grid;place-items:center}
.opt img{width:100%;height:100%;pointer-events:none}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #b9d3e6}
.opt.sel{outline:7px solid #ffc400;background:#fff8d6;animation:bob .9s ease-in-out infinite}
.opt.nudge{animation:wig .7s 2}

/* —— win —— */
#win{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,34px);pointer-events:none}
#win>*{pointer-events:auto}
#wordcard{background:#fff;border-radius:30px;padding:8px 30px 12px;box-shadow:0 8px 0 #b9d3e6;font-size:clamp(44px,8vw,80px);line-height:1.1;display:flex;align-items:center;gap:14px;animation:popin .5s}
#wordcard .star{color:#ffc400;text-shadow:0 3px 0 #c98a00}
.gift{position:relative;width:120px;height:112px;animation:wig 1s infinite, popin .5s;background:none}
.gift .box{position:absolute;left:8px;right:8px;bottom:0;height:72px;border-radius:10px;background:#ff5d8f}
.gift .lid{position:absolute;left:0;right:0;top:16px;height:30px;border-radius:8px;background:#ff85ab;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.gift::before{content:"";position:absolute;left:50%;top:16px;bottom:0;width:22px;transform:translateX(-50%);background:#ffd21f;z-index:1}
.gift::after{content:"";position:absolute;left:50%;top:0;width:44px;height:26px;transform:translateX(-50%);border-radius:50%;background:#ffd21f;z-index:1}
#newbricks{background:#fff;border-radius:30px;padding:6px 18px 10px;box-shadow:0 8px 0 #b9d3e6;text-align:center;animation:popin .5s}
#nbimgs{display:flex;justify-content:center}
#nbimgs img{width:clamp(70px,11vw,104px);aspect-ratio:1;animation:bob 1s ease-in-out infinite}
#nbimgs img:nth-child(2){animation-delay:.15s}#nbimgs img:nth-child(3){animation-delay:.3s}
.nbt{font-size:clamp(20px,3vw,30px)}
#next{width:104px;height:104px;border-radius:50%;background:#3fae49;box-shadow:0 8px 0 #2a7c33;display:grid;place-items:center;animation:popin .5s, bob 1s ease-in-out .5s infinite}
#next:active{transform:translateY(5px);box-shadow:0 3px 0 #2a7c33}
#next svg{width:52px;height:52px}

/* —— grown-ups —— */
#parent{position:fixed;inset:0;background:rgba(30,40,60,.55);display:grid;place-items:center}
#parent .box{background:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:280px;font-weight:600}
#parent h2{margin:0 0 4px;font-size:22px}
#parent button{padding:14px 18px;border-radius:14px;background:#e8f0f7;font-size:18px;text-align:left}
#parent button.danger{background:#ffe1e1;color:#b3261e}

@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes wig{20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (max-height:520px){.round{width:56px;height:56px}#title{padding:4px 18px 6px}.opt{width:84px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <button id="back" class="round" aria-label="Home"><svg viewBox="0 0 24 24" fill="#2f8fe0"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></button>
  <div id="title"><div id="say"></div><div id="hint"></div><div id="dots"></div></div>
  <button id="spin" class="round" aria-label="Turn"><svg viewBox="0 0 24 24" fill="none" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.5 3.5v4.2h-4.2"/></svg></button>
  <button id="undo" class="round tool" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="#2f8fe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a5.5 5.5 0 0 1 0 11h-2" transform="translate(0 -3)"/></svg></button>
  <button id="trash" class="round tool" aria-label="Remove something"><svg viewBox="0 0 24 24" fill="none" stroke="#e53935" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg></button>
  <button id="zoom" class="round tool" aria-label="Closer or farther"><svg viewBox="0 0 24 24" fill="none" stroke="#7a4fd0" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M7.8 10.5h5.4M10.5 7.8v5.4"/></svg></button>
  <button id="grab" class="round tool" aria-label="Move a brick"><svg viewBox="0 0 24 24" fill="none" stroke="#3fae49" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11m0-5.5V5a1.5 1.5 0 0 1 3 0v6m0-4.5a1.5 1.5 0 0 1 3 0V12m0-2a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.6 6.5-6.2 6.5H13c-2.2 0-3.7-1-4.8-2.7L5.3 14a1.6 1.6 0 0 1 2.6-1.8L8 12.4"/></svg></button>
  <button id="hand" class="round tool" aria-label="Slide the plate"><svg viewBox="0 0 24 24" fill="none" stroke="#2f8fe0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3 9 6M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
  <img id="ref" alt="" hidden>
  <div id="bar">
    <div id="swatches"></div>
    <button id="tex" class="round deco" aria-label="Texture"><svg viewBox="0 0 24 24" fill="none" stroke="#34405a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.3h18M3 14.7h18M12 4v5.3M7.5 9.3v5.4M16.5 9.3v5.4M12 14.7V20"/></svg></button>
    <button id="turn" class="round" aria-label="Turn the brick"><svg viewBox="0 0 24 24" fill="none" stroke="#3fae49" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="12" height="7" rx="1.5"/><path d="M12 4.5a7 7 0 0 1 8 7"/><path d="M17.2 9.3 20 11.6l2.2-2.9"/></svg></button>
  </div>
  <div id="texmenu" class="pop" hidden><button class="round" data-t="0" aria-label="No texture"><svg viewBox="0 0 24 24" fill="none" stroke="#34405a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.500"/><path d="M6 18 18 6"/></svg></button><button class="round" data-t="1" aria-label="Eyes"><svg viewBox="0 0 24 24" fill="none" stroke="#34405a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3.2" fill="#34405a"/></svg></button><button class="round" data-t="2" aria-label="Wall"><svg viewBox="0 0 24 24" fill="none" stroke="#34405a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.3h18M3 14.7h18M12 4v5.3M7.5 9.3v5.4M16.5 9.3v5.4M12 14.7V20"/></svg></button><button class="round" data-t="3" aria-label="Waves"><svg viewBox="0 0 24 24" fill="none" stroke="#34405a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9c2.5-3 4.5-3 7 0s4.500 3 7 0 4-2.600 6-.5M2 16c2.500-3 4.500-3 7 0s4.500 3 7 0 4-2.600 6-.5"/></svg></button><button class="round" data-t="4" aria-label="Grass"><svg viewBox="0 0 24 24" fill="none" stroke="#34405a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c.5-5 1.500-8 3-10 .2 3 .8 6 1.500 10M9 20c0-7 1-12 3-16 1 4 1.500 9 1.500 16M15.500 20c.5-4 1.500-7 3.500-9.500 0 3 .5 6 1.500 9.500M2 20h20" fill="#3fae49" stroke="#2a7c33"/></svg></button><button class="round" data-t="abc" aria-label="A letter or number"><b>Aa1</b></button></div>
  <div id="keys" class="pop" hidden></div>
  <div id="tray"></div>
</div>

<div id="win" hidden>
  <button id="wordcard"><span class="star">★</span><span id="word"></span></button>
  <button id="gift" class="gift" aria-label="Open the gift"><div class="lid"></div><div class="box"></div></button>
  <div id="newbricks" hidden><div id="nbimgs"></div><div class="nbt">New bricks!</div></div>
  <button id="next" aria-label="Next" hidden><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></button>
</div>

<div id="home">
  <h1 id="logo"></h1>
  <div id="worlds"></div>
  <div id="cards"></div>
 <div id="boot">Loading…</div>
  <button id="gear" aria-label="Grown-ups: press and hold">⚙</button>
</div>

<div id="parent" hidden>
  <div class="box">
    <h2>Grown-ups</h2>
    <button id="pVoice"></button>
    <button id="pUnlock">Unlock all missions</button>
    <button id="pReset" class="danger">Reset progress</button>
    <button id="pClose">Close</button>
  </div>
</div>

<script>
// if the game cannot start, say why on the page instead of staying blank
(function () {
  var boot = document.getElementById('boot');
  function tell(msg) { if (!boot.hidden) boot.textContent = 'The game could not start: ' + msg; }
  window.addEventListener('error', function (e) { tell(e.message || ('could not load ' + ((e.target && (e.target.src || e.target.href)) || 'a file'))); }, true);
  window.addEventListener('unhandledrejection', function (e) { tell(String((e.reason && e.reason.message) || e.reason)); });
})();
</script>
<script src="models.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
